<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Упаковка заказов</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  >
  <link rel="stylesheet" href="./css/navigation.css">
</head>

<body>

  <main class="app">

    <!-- HEADER -->
    <header class="header">
      <div>
        <h1>Упаковка</h1>
        <p id="progress">Заказов: —</p>
      </div>
    </header>


    <!-- SEARCH -->
    <section class="search">

      <label for="order-search">
        Номер этикетки
      </label>

      <div class="search-row">

        <input
          id="order-search"
          type="text"
          inputmode="numeric"
          placeholder="Например: 8783"
          autocomplete="off"
        >

        <button id="search-button">
          Найти
        </button>

      </div>

    </section>


    <!-- ORDERS -->
    <section
      id="orders"
      class="orders"
    >
      <!-- Orders will be rendered here -->
    </section>


    <!-- PAGINATION -->
    <nav class="pagination">

      <button
        id="previous-button"
        disabled
      >
        ← Назад
      </button>

      <button id="next-button">
        Далее →
      </button>

    </nav>


    <!-- PAGE SIZE -->
    <section class="page-size">

      <span>Заказов на странице</span>

      <div class="page-size-buttons">

        <button data-limit="5">
          5
        </button>

        <button data-limit="7">
          7
        </button>

        <button
          data-limit="10"
          class="active"
        >
          10
        </button>

        <button data-limit="15">
          15
        </button>

      </div>

    </section>

  </main>


  <div id="navigation"></div>
  <script src="./js/navigation.js"></script>
  <script src="./js/config.js"></script>
  <script
    src="./js/packaging.js"
    type="module"
  ></script>

</body>
</html>
