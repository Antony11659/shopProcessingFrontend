<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>La De Parfum — Производство</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f4f4f4;
      color: #111;
    }

    .app {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;
    }

    .card {
      width: 100%;
      max-width: 650px;

      background: white;

      border-radius: 28px;

      padding: 50px;

      text-align: center;

      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.08);
    }

    .logo {
      margin-bottom: 35px;

      font-size: 16px;
      font-weight: bold;

      letter-spacing: 2px;

      color: #777;
    }

    h1 {
      margin: 0;

      font-size: 36px;
    }

    .description {
      margin-top: 15px;

      font-size: 18px;
      line-height: 1.5;

      color: #777;
    }

    .shops {
      margin: 35px 0;

      font-size: 20px;
      line-height: 1.8;

      color: #333;
    }

    button {
      width: 100%;

      border: none;
      border-radius: 18px;

      padding: 22px;

      background: #111;
      color: white;

      font-size: 20px;
      font-weight: bold;

      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    #status {
      min-height: 28px;

      margin-top: 20px;

      font-size: 17px;

      color: #666;
    }

    .error {
      color: #c62828 !important;
      font-weight: bold;
    }

    @media (max-width: 600px) {

      .card {
        padding: 35px 25px;
      }

      h1 {
        font-size: 30px;
      }

    }
  </style>
</head>


<body>

  <main class="app">

    <section class="card">

      <div class="logo">
        LA DE PARFUM
      </div>


      <h1>
        Добро пожаловать 👋
      </h1>


      <p class="description">
        Перед началом работы распечатайте
        этикетки Ozon для всех магазинов.
      </p>


      <div class="shops">
        Raspiv Parfuma<br>
        Motive Parfuma<br>
        La De Parfum<br>
        Dubai Oil
      </div>


      <button id="ozonReadyButton">
        ✓ ЭТИКЕТКИ OZON РАСПЕЧАТАНЫ
      </button>


      <div id="status"></div>

    </section>

  </main>


  <script src="./js/config.js"></script>
  <script src="./js/productionStart.js"></script>

</body>

</html>
